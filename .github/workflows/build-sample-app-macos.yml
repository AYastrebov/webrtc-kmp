name: Build macOS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build sample app iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17
          cache: gradle

      - name: Gradle cache
        uses: gradle/gradle-build-action@v2

      - name: Cache konan directory
        uses: actions/cache@v3
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('*.gradle.kts', 'buildSrc/*') }}
          restore-keys: |
            ${{ runner.os }}-konan- 

      - name: SwiftPM cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .swiftpm-locks/*/swiftPMCheckout
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('.swiftpm-locks/*/swiftImport/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Build sample app
        run: |
          cd sample/iosApp
          xcodebuild -project iosApp.xcodeproj -configuration Debug -scheme iosApp -sdk iphonesimulator -arch arm64
